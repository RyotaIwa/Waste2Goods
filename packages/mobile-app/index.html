
<!DOCTYPE html>
<html lang="en">
  <head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#052e16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Waste2Goods - Mobile App</title>
    <meta name="description" content="Gamified recycling mobile app" />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      html, body { height: 100%; margin: 0; padding: 0; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
      #root { height: 100%; width: 100%; }
      @media (max-width: 767px) {
        html, body { overflow: hidden; }
        #root { height: 100%; height: 100dvh; }
      }
      @media (min-width: 768px) {
        html, body { overflow: auto; }
        body { min-height: 100vh; }
      }
    </style>
    
  </head>

  <body>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
  </body>
</html>

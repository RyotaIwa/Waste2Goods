sonar.projectKey=waste2goods-gamified-recycling-platform
sonar.projectName=Waste2Goods - Gamified Recycling Platform
sonar.projectVersion=1.0.0-D2-P1

sonar.sources=packages/backend/src,packages/core/src,packages/mobile-app/src,packages/admin-panel/src,packages/kiosk-app/src
sonar.tests=

sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/node_modules/**,\
  **/*.d.ts,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.specstory/**,\
  **/waste2goods_mobile/**

sonar.cpd.exclusions=\
  **/*.css,\
  **/*.json,\
  **/packages/*/src/app/components/ui/**

sonar.javascript.lcov.reportPaths=**/coverage/lcov.info
sonar.typescript.lcov.reportPaths=**/coverage/lcov.info

sonar.javascript.node.maxspace=4096

sonar.qualitygate.wait=true

sonar.eslint.reportPaths=

sonar.rules.javascript:S3776.maximumCognitiveComplexity=15
sonar.rules.typescript:S3776.maximumCognitiveComplexity=15

sonar.javascript.environment.angular=true
sonar.javascript.environment.node=true
sonar.javascript.environment.browser=true

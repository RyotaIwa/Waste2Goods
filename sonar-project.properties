sonar.projectKey=RyotaIwa_Waste2Goods
sonar.projectName=Waste2Goods - Gamified Recycling Platform
sonar.projectVersion=1.0.0-D2-P1

# ============================================================
# SONARCLOUD
# ============================================================
sonar.organization=ryotaiwa
sonar.host.url=https://sonarcloud.io

# ============================================================
# SOURCE CODE
# ============================================================
# All application/source code in the monorepo
sonar.sources=packages/backend/src,packages/core/src,packages/mobile-app/src,packages/admin-panel/src,packages/kiosk-app/src

# ============================================================
# TEST CODE
# ============================================================
# Use ONE root only to prevent overlapping test scopes.
sonar.tests=packages/backend

# ============================================================
# TEST FILES
# ============================================================
# Tests are separated from production source files by using
# test inclusions together with source exclusions.
sonar.test.inclusions=\
  packages/backend/src/**/*.test.js,\
  packages/backend/src/**/*.spec.js,\
  packages/backend/test-*.mjs

# ============================================================
# SOURCE EXCLUSIONS
# ============================================================
# Test files and generated/dependency files must not be treated
# as production source files.
sonar.exclusions=\
  **/node_modules/**,\
  **/*.d.ts,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.specstory/**,\
  **/waste2goods_mobile/**,\
  **/*.test.js,\
  **/*.spec.js,\
  **/test-*.mjs

# ============================================================
# ENCODING
# ============================================================
sonar.sourceEncoding=UTF-8

# ============================================================
# JAVASCRIPT / TYPESCRIPT COVERAGE
# ============================================================
sonar.javascript.lcov.reportPaths=**/coverage/lcov.info
sonar.typescript.lcov.reportPaths=**/coverage/lcov.info

# ============================================================
# CODE DUPLICATION
# ============================================================
sonar.cpd.exclusions=\
  **/*.css,\
  **/*.json,\
  **/packages/*/src/app/components/ui/**

# ============================================================
# JAVASCRIPT / TYPESCRIPT
# ============================================================
sonar.javascript.node.maxspace=4096

# ============================================================
# QUALITY GATE
# ============================================================
sonar.qualitygate.wait=true

# ============================================================
# ESLINT
# ============================================================
sonar.eslint.reportPaths=

# ============================================================
# COGNITIVE COMPLEXITY
# ============================================================
sonar.rules.javascript:S3776.maximumCognitiveComplexity=15
sonar.rules.typescript:S3776.maximumCognitiveComplexity=15

# ============================================================
# ENVIRONMENTS
# ============================================================
sonar.javascript.environment.angular=true
sonar.javascript.environment.node=true
sonar.javascript.environment.browser=true

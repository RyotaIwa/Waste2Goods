sonar.projectKey=RyotaIwa_Waste2Goods
sonar.projectName=Waste2Goods - Gamified Recycling Platform
sonar.projectVersion=1.0.0-D2-P1

# ============================================================
# SONARCLOUD
# ============================================================
sonar.organization=ryotaiwa
sonar.host.url=https://sonarcloud.io

# ============================================================
# MONOREPO SOURCE & TEST SCOPES
# ============================================================
# Set common root to packages to avoid nested folder indexing conflicts
sonar.sources=packages
sonar.tests=packages

# ============================================================
# TEST FILES
# ============================================================
sonar.test.inclusions=\
  packages/backend/src/**/*.test.js,\
  packages/backend/src/**/*.spec.js,\
  packages/backend/test-*.mjs

# ============================================================
# SOURCE EXCLUSIONS
# ============================================================
# NOTE: packages/backend/database/*.sql (MySQL/SQLite dumps) are excluded because
# SonarQube Cloud analyzes .sql files with the Oracle PL/SQL analyzer only. It cannot
# resolve MySQL syntax, which is why the project shows the "Data Dictionary is not
# configured for the PLSQL analyzer" analysis warning (rules S3641, S3921, S3618 and
# S3651 can never run without an Oracle JDBC connection).
# Exclude test files, dependencies, and build artifacts from main sources
sonar.exclusions=\
  **/node_modules/**,\
  **/*.d.ts,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.specstory/**,\
  **/waste2goods_mobile/**,\
  packages/backend/database/*.sql,\
  packages/backend/src/**/*.test.js,\
  packages/backend/src/**/*.spec.js,\
  packages/backend/test-*.mjs

# ============================================================
# ENCODING
# ============================================================
sonar.sourceEncoding=UTF-8

# ============================================================
# COVERAGE & METRICS
# ============================================================
sonar.javascript.lcov.reportPaths=**/coverage/lcov.info
sonar.typescript.lcov.reportPaths=**/coverage/lcov.info

# ============================================================
# CODE DUPLICATION
# ============================================================
sonar.cpd.exclusions=\
  **/*.css,\
  **/*.json,\
  **/packages/*/src/app/components/ui/**

# ============================================================
# QUALITY GATE
# ============================================================
sonar.qualitygate.wait=false
